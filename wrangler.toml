name = "yargiconfig"
main = "src/index.js"
compatibility_date = "2026-11-11"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "yargiconfig-db"
database_id = "42816f44-2362-49b9-b59a-4bc2930905c7"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "yargiconfig-assets"

[vars]
ACCESS_TEAM_DOMAIN = "misty-rice-6b8d.cloudflareaccess.com"
ACCESS_AUD = "TEMPORARY_AUD"
ADMIN_EMAILS = "BURAYA_KENDI_CLOUDFLARE_EMAILIN"

